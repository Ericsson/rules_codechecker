name: rules-codechecker-tests

# Triggers the workflow on push or pull request events.
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "README*"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "README*"
      - "LICENSE"


permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu_test:
    name: "Tests: Bazel ${{ matrix.bazel_version }} (Ubuntu)"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        bazel_version:
          - "7.7.1"
          - "8.5.1"

    env:
      # Workspace-local Bazel disk cache, persisted across runs via actions/cache.
      BAZEL_DISK_CACHE: ${{ github.workspace }}/.bazel-disk-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set bazel version to ${{ matrix.bazel_version }}
        run: echo "${{ matrix.bazel_version }}" > .bazelversion
        shell: bash

      # I did not use our setup script to leverage
      # the power of caching provided by this action.
      - name: Setup environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: ci
          environment-file: .ci/micromamba/ci.yaml
          create-args: >-
            bazel=${{ matrix.bazel_version }}
          cache-environment: true
          init-shell: bash
          condarc: |
            channels:
              - conda-forge

      # Cache the Bazel disk cache (action outputs, downloaded repos) so that
      # dependency fetching and unchanged targets are not run on every CI run.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-disk-ubuntu-${{ matrix.bazel_version }}-${{ hashFiles('MODULE.bazel', '.ci/micromamba/ci.yaml') }}
          restore-keys: |
            bazel-disk-ubuntu-${{ matrix.bazel_version }}-

      - name: Print versions
        run: |
          bazel version
          CodeChecker version
          echo "[NOTE]: CodeChecker may find different analyzer binaries" \
               "when invoking directly, or in bazel's sandbox environment!" \
               "Be sure to double check during debugging."
          CodeChecker analyzers
        shell: bash -el {0}

      - name: Run lint tests
        run: |
          bazel test //test/buildifier --disk_cache="$BAZEL_DISK_CACHE" --test_output=all
          bazel test //test/pylint --disk_cache="$BAZEL_DISK_CACHE" --test_output=all
        shell: bash -el {0}

      # Splitting test runs to: bazel unit tests, bazel foss tests, python unittests
      # Therefore: less wasted CI runtime.
      - name: Run unit tests
        run: |
          bazel test //... --disk_cache="$BAZEL_DISK_CACHE" --test_tag_filters=-foss --test_output=errors
        shell: bash -el {0}

      - name: Run foss tests
        run: |
          bazel test //test/foss/... --disk_cache="$BAZEL_DISK_CACHE" --test_output=errors
        shell: bash -el {0}

      - name: Run python unittests
        run: |
          pytest test ${{ runner.debug == '1' && '--log-cli-level=DEBUG' || '' }}
        shell: bash -el {0}

  rhel9_test:
    name: "Tests: Bazel ${{ matrix.bazel_version }} (RHEL9)"
    runs-on: ubuntu-24.04
    container:
      image: redhat/ubi9:latest
      options: --init
    strategy:
      fail-fast: false
      matrix:
        bazel_version:
          - "7.7.1"
          - "8.5.1"

    env:
      # Workspace-local Bazel disk cache, persisted across runs via actions/cache.
      # It lives under the workspace so it can be chowned to the non-root user.
      BAZEL_DISK_CACHE: ${{ github.workspace }}/.bazel-disk-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set bazel version to ${{ matrix.bazel_version }}
        run: echo "${{ matrix.bazel_version }}" > .bazelversion
        shell: bash

      - name: Setup environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: ci
          environment-file: .ci/micromamba/ci.yaml
          create-args: >-
            bazel=${{ matrix.bazel_version }}
          cache-environment: true
          init-shell: bash
          condarc: |
            channels:
              - conda-forge

      # Cache the Bazel disk cache (action outputs, downloaded repos) so that
      # dependency fetching and unchanged targets are not run on every CI run.
      - name: Cache Bazel disk cache
        uses: actions/cache@v4
        with:
          path: ${{ env.BAZEL_DISK_CACHE }}
          key: bazel-disk-rhel9-${{ matrix.bazel_version }}-${{ hashFiles('MODULE.bazel', '.ci/micromamba/ci.yaml') }}
          restore-keys: |
            bazel-disk-rhel9-${{ matrix.bazel_version }}-

      - name: Create a non-root user
        run: |
          useradd -m test
          mkdir -p "$BAZEL_DISK_CACHE"
          chown -R test:test $GITHUB_WORKSPACE
          chown -R test:test $HOME
          chown -R test:test $MAMBA_ROOT_PREFIX
          chown -R test:test "$BAZEL_DISK_CACHE"
        shell: bash -el {0}

      - name: Print versions
        run: |
          runuser -u test -- bazel version
          CodeChecker version
          echo "[NOTE]: CodeChecker may find different analyzer binaries" \
               "when invoking directly, or in bazel's sandbox environment!" \
               "Be sure to double check during debugging."
          CodeChecker analyzers
        shell: bash -el {0}

      - name: Run lint tests
        run: |
          runuser -u test -- bazel test //test/buildifier --disk_cache="$BAZEL_DISK_CACHE" --test_output=all
          runuser -u test -- bazel test //test/pylint --disk_cache="$BAZEL_DISK_CACHE" --test_output=all
        shell: bash -el {0}

      # Splitting test runs to: bazel unit tests, bazel foss tests, python unittests
      # Therefore: less wasted CI runtime.
      - name: Run unit tests
        run: |
          runuser -u test -- bazel test //... --disk_cache="$BAZEL_DISK_CACHE" --test_tag_filters=-foss --test_output=errors
        shell: bash -el {0}

      - name: Run foss tests
        run: |
          runuser -u test -- bazel test //test/foss/... --disk_cache="$BAZEL_DISK_CACHE" --test_output=errors
        shell: bash -el {0}

      - name: Run python unittests
        run: |
          runuser -u test -- pytest test ${{ runner.debug == '1' && '--log-cli-level=DEBUG' || '' }}
        shell: bash -el {0}
